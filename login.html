<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="login.css">
</head>

<body>

  <section class="login-card">

    <div class="login-content">

      <welcome>Welcome <back>Back</back></welcome>

      <p>Login to your NovelHub account</p>

      <label>Email Address</label>
      <input type="email" placeholder="example@gmail.com" class="boxes">

      <label>Password</label>
      <input type="password" placeholder="Enter your password" class="boxes">

      <div class="remember-row">
        <span>
          <input type="checkbox" class="remembermebox">
          <spin>Remember Me</spin>
        </span>

        <a href="">Forgot Password?</a>
      </div>

      <input type="submit" value="Log In" class="loginbtn">

      <or>or</or>

      <div class="contwgoogle">
        <img src="googlelogo.png" alt="Continue with Google" class="googlelogo">
        <p>Continue with Google</p>
      </div>

      <dont>
        Dont Have an Account?
        <a href="signup.html">Sign Up</a>
      </dont>

    </div>

  </section>

</body>
</html>
