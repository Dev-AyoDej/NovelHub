<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>signup</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="signup.css">
</head>

<body>

  <section class="signup-card">

    <div class="login-content">

      <welcome>Create <back>Account</back></welcome>

      <p>Sign up to NovelHUB get started</p>

      <label>Email Address</label>
      <input type="email" placeholder="example@gmail.com" class="boxes">

      <label> Create Password</label>
      <input type="password" placeholder="Create a strong password" class="boxes">

      <label> Confirm Password</label>
      <input type="password" placeholder="Re-enter your password" class="boxes">

      <div class="remember-row">
        <span>
          <input type="checkbox" class="remembermebox">
          <spin>I agree to NovelHUB Terms & Conditions</spin>
        </span>

      </div>

      <input type="submit" value="Create Account" class="loginbtn">

      <or>or</or>

      <div class="contwgoogle">
        <img src="googlelogo.png" alt="Continue with Google" class="googlelogo">
        <p>Continue with Google</p>
      </div>

      <dont>
        Already Have an Account?
        <a href="login.html">Login</a>
      </dont>

    </div>

  </section>

</body>
</html>
